name: Check product collection counts

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  check-products:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install packages
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run product count checks
        run: npm test
